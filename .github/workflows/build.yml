name: Build Dalilak APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore signing key from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.DALILAK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DALILAK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DALILAK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DALILAK_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > dalilak.jks
          printf 'storeFile=dalilak.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dalilak-apk
          path: app/build/outputs/apk/release/*.apk
